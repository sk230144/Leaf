# Render Blueprint: Postgres + one Docker web service (API + built frontend).
# Deploy: Render dashboard -> New -> Blueprint -> select this repo, then set
# ANTHROPIC_API_KEY in the service's Environment tab.
databases:
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf
    user: bookleaf

services:
  - type: web
    name: bookleaf-support
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: DATABASE_URL_UNPOOLED # used by `prisma migrate deploy` on boot
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: NODE_ENV
        value: production
